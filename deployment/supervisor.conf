; AI Movie Advisor process. setup_ec2.sh fills in __APP_DIR__ and __APP_USER__.
; Configuration comes from __APP_DIR__/.env (read by the app), so no secrets live here.
[program:ai-movie-advisor]
command=__APP_DIR__/.venv/bin/streamlit run app.py
directory=__APP_DIR__
user=__APP_USER__
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/ai-movie-advisor.out.log
stderr_logfile=/var/log/supervisor/ai-movie-advisor.err.log
