# AI Movie Advisor: reverse proxy in front of Streamlit (127.0.0.1:8501).
# Installed by deployment/setup_ec2.sh into /etc/nginx/sites-available/.

# 10 requests/second per client IP, with bursts; protects the single app process.
limit_req_zone $binary_remote_addr zone=ama_requests:10m rate=10r/s;

upstream ai_movie_advisor {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    server_name your_domain.com;  # replace with your domain

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # After `certbot --nginx` enables HTTPS, also send:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=ama_requests burst=40 nodelay;

        proxy_pass http://ai_movie_advisor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # Streamlit uses a WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
